name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: tfauto-${{ github.ref_name }}-linux-amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            asset: tfauto-${{ github.ref_name }}-darwin-amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset: tfauto-${{ github.ref_name }}-windows-amd64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build release binary
        shell: bash
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -ldflags "-X github.com/khushaltarsariya/tfauto/cmd.version=${GITHUB_REF_NAME} -X github.com/khushaltarsariya/tfauto/cmd.commit=${GITHUB_SHA::7} -X github.com/khushaltarsariya/tfauto/cmd.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/${{ matrix.asset }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish-release:
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/tfauto-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release binaries found in dist/" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > dist/checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
